[package]
name = "extension-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent Serein extension host: package store, worker, snapshots and event admission."

[features]
# Embeds the demo-only starter packages, as in the desktop `demo` build.
demo = []

[dependencies]
base64 = "0.22.1"
client-core.workspace = true
egui.workspace = true
extensions.workspace = true
futures-util.workspace = true
getrandom.workspace = true
model.workspace = true
serde.workspace = true
serde_json.workspace = true
# Plugin databases need the authorizer, progress handler and limits.
rusqlite = { workspace = true, features = ["hooks", "limits"] }
sha2 = "=0.10.9"
tokio.workspace = true
url.workspace = true
wreq.workspace = true
zeroize.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
test-support.workspace = true
wat = "=1.245.1"

[lints]
workspace = true

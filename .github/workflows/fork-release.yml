name: Fork release
run-name: Fork release ${{ inputs.tag }} by @${{ github.actor }}

# The fork's releases: the upstream Release workflow needs upstream's signing secrets,
# Homebrew tap and package repository site, so the fork builds and publishes its own.
# Run it by hand; it never runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, the upstream nightly it builds on plus -fork.N (v1.0.0-nightly.20261123.102-fork.1)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: serein-fork-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag and apply its version to the manifests
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # The in-app updater offers only pre-releases tagged vX.Y.Z-nightly.*.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+\.[0-9]+-fork\.[0-9]+$'; then
            echo "Fork releases are tagged v<upstream nightly version>-fork.<n>, not $TAG"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi
          version=${TAG#v}
          python3 .github/release/version.py "$version"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
            fuzz/Cargo.lock
            packaging/macos/Info.plist
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PACKAGE_ROOT: dist
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-manifests
          path: .
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Offline checks
        run: cargo xtask check
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun tests/login-handoff.cjs
      - name: Package app
        run: |
          cargo xtask package
          mkdir release-assets
          echo "ASSET=serein-$TAG-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_ENV"
      # xtask signs the Mac app ad hoc; the fork has no Developer ID, so it is not notarized.
      - name: Archive Mac package
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc "$PACKAGE_ROOT" "release-assets/$ASSET.zip"
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PACKAGE_ROOT/*" -DestinationPath "release-assets/$env:ASSET.zip"
          $installer = Get-ChildItem -Path "dist-installer/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/$env:ASSET-Setup.exe"
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: prepare
    uses: ./.github/workflows/linux-packages.yml
    with:
      release: true
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: serein-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        # The shared Linux workflow's flatpakref points at upstream's Flatpak repository,
        # which the fork does not publish to; the .flatpak bundle installs on its own.
        run: |
          rm -f serein.flatpakref
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish the pre-release
        run: |
          set -eu
          upstream=${VERSION%-fork.*}
          cat > notes.md <<NOTES
          Serein built from this fork's \`main\` ($GITHUB_SHA): upstream [v$upstream](https://github.com/ViceVerse-cz/Serein/releases/tag/v$upstream) plus the fork's plugin host, whose capabilities are Preview.

          Builds from this fork update only to the fork's releases, on the Nightly update channel.

          - **Windows**: the \`Setup.exe\` installer, or the \`.zip\` to run without installing. Not code-signed, so SmartScreen may ask before it runs.
          - **macOS** (Apple silicon): the \`.zip\`. Not notarized: open it with right-click → Open the first time.
          - **Linux**: the AppImage, Flatpak, or the \`.deb\`, \`.rpm\` or Arch package for your distribution.

          Check downloads against \`SHA256SUMS.txt\`.
          NOTES
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" \
            --title "Serein $VERSION" --notes-file notes.md --prerelease
